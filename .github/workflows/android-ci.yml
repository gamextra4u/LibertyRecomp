name: Android CI - APK Artifact

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/android-sdk
      ANDROID_NDK_VERSION: 27.2.12479018
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init Android-related submodules only (shallow)
        run: |
          set -eux
          echo "Syncing submodule configuration"
          git submodule sync --recursive
          git config --global advice.detachedHead false

          # Android-relevant submodules determined by repo analysis:
          # - thirdparty/SDL            (SDL3 used by Android native code)
          # - glue/rexglue-sdk-main    (ReXGlue SDK used by native code)
          # - thirdparty/stb           (small header-only used by native code)
          # - thirdparty/imgui         (UI library referenced by native code)
          # Adjust this list if your build requires additional submodules.

          for path in thirdparty/SDL glue/rexglue-sdk-main thirdparty/stb thirdparty/imgui; do
            if git config -f .gitmodules --get "submodule.$path.url" > /dev/null 2>&1; then
              echo "Initializing submodule: $path"
              # Shallow clone to reduce CI time and bandwidth
              git submodule update --init --depth 1 "$path" || true
            else
              echo "Submodule $path not found in .gitmodules, skipping"
            fi
          done

          # If the ReXGlue SDK was initialised, initialise its nested submodules shallowly too.
          if [ -d glue/rexglue-sdk-main ]; then
            echo "Syncing nested submodules inside glue/rexglue-sdk-main"
            git -C glue/rexglue-sdk-main submodule sync --recursive || true
            git -C glue/rexglue-sdk-main submodule update --init --depth 1 || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android cmdline-tools, SDK, NDK and CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          # Arrange directory so sdkmanager is at $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest/ || true
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-34" "ndk;27.2.12479018" "cmake;3.31.4" "build-tools;34.0.0"
      - name: Accept Android SDK licenses
        run: |
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses

      - name: Set ANDROID_NDK env
        run: echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> $GITHUB_ENV

      - name: Build debug APK (Gradle wrapper)
        working-directory: os/android
        run: |
          chmod +x ./gradlew
          # Use parallel Gradle workers and moderate JVM heap to improve CI build throughput
          ./gradlew assembleDebug --no-daemon -Porg.gradle.parallel=true -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: libertyrecomp-apk
          path: os/android/app/build/outputs/**/*.apk
